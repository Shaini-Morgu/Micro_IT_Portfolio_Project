<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>TodoList Project</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<div class="container">
		<h1>📝 My Todo List</h1>
		<div class="input-area">
			<input placeholder="Enter task..." class="js-ip">
			<input type="date" class="js-dp">
			<input type="time" class="js-tp">
			<button onclick="addTodo();">Add</button>
		</div>
	</div>

	<div class="task-wrapper">
		<h2>Your Tasks</h2>
		<div class="res"></div>
	</div>

	<script src="TodoList.js"></script>
</body>
</html>
